@if (isOpen) {
  <div class="location-dialog-backdrop" role="presentation">
    <section class="location-dialog" role="dialog" aria-modal="true" [attr.aria-label]="t('PROPERTY_LOCATION_OPEN')">
      <header class="location-dialog-toolbar">
        <div class="location-dialog-toolbar-side">
          <button
            type="button"
            class="location-layer-panel-toggle"
            [attr.aria-label]="isLayerPanelVisible ? t('PROPERTY_LOCATION_PANEL_HIDE') : t('PROPERTY_LOCATION_PANEL_SHOW')"
            [title]="isLayerPanelVisible ? t('PROPERTY_LOCATION_PANEL_HIDE') : t('PROPERTY_LOCATION_PANEL_SHOW')"
            (click)="toggleLayerPanelVisibility()"
          >
            <span class="material-symbols-outlined">
              {{ isLayerPanelVisible ? 'left_panel_close' : 'left_panel_open' }}
            </span>
          </button>
        </div>

        <p class="location-dialog-toolbar-title">{{ propertyTitle || '-' }}</p>

        <div class="location-dialog-toolbar-side location-dialog-toolbar-side-right">
          <button
            type="button"
            class="location-dialog-close"
            [attr.aria-label]="t('PROPERTY_LOCATION_CLOSE')"
            (click)="onCloseClick()"
          >
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
      </header>

      <div #mapLayout class="location-map-layout">
        @if (isLayerPanelVisible) {
          <aside class="location-layer-panel" [style.width.px]="layerPanelWidthPx">
            <header class="location-layer-panel-header">
              <h3>{{ t('PROPERTY_LOCATION_LAYERS_TITLE') }}</h3>
            </header>
            <div class="location-layer-list">
              @for (layer of layerOptions; track layer.id) {
                <label class="location-layer-item">
                  <input
                    type="checkbox"
                    [checked]="isLayerEnabled(layer.id)"
                    (change)="onLayerToggle(layer.id, $event)"
                  />
                  <span>{{ t(layer.label) }}</span>
                </label>
              }
            </div>
          </aside>
          <div
            class="location-layer-splitter"
            role="separator"
            aria-orientation="vertical"
            (mousedown)="onLayerPanelSplitterMouseDown($event)"
          ></div>
        }

        <div class="location-map-pane">
          @if (mapLoadError) {
            <div class="location-map-message">{{ mapLoadError }}</div>
          } @else {
            <div #mapContainer class="location-map"></div>
          }
        </div>
      </div>
    </section>
  </div>
}
