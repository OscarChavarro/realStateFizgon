@if (isOpen) {
  <div class="location-dialog-backdrop" role="presentation">
    <section
      class="location-dialog"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="t('PROPERTY_LOCATION_OPEN')"
    >
      <header class="location-dialog-toolbar">
        <div class="location-dialog-toolbar-side-left">
          <button
            type="button"
            class="location-layer-panel-toggle"
            [attr.aria-label]="
              isLayerPanelVisible
                ? t('PROPERTY_LOCATION_PANEL_HIDE')
                : t('PROPERTY_LOCATION_PANEL_SHOW')
            "
            [title]="
              isLayerPanelVisible
                ? t('PROPERTY_LOCATION_PANEL_HIDE')
                : t('PROPERTY_LOCATION_PANEL_SHOW')
            "
            (click)="onLayerPanelToggleClick()"
          >
            <span class="material-symbols-outlined">
              {{ isLayerPanelVisible ? 'left_panel_close' : 'left_panel_open' }}
            </span>
          </button>
        </div>

        <p class="location-dialog-toolbar-title">{{ propertyTitle || '-' }}</p>

        <div class="location-dialog-toolbar-side-right">
          <button
            type="button"
            class="location-dialog-close"
            [attr.aria-label]="t('PROPERTY_LOCATION_CLOSE')"
            (click)="onCloseClick()"
          >
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
      </header>

      <app-google-map
        [properties]="mapProperties"
        [googleMapsApiKey]="googleMapsApiKey"
        [googleMapsMapId]="googleMapsMapId"
        [selectedLanguage]="selectedLanguage"
        [interactionEnabled]="false"
      ></app-google-map>
    </section>
  </div>
}
