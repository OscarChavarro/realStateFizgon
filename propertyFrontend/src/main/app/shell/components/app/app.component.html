<main class="listing-page">
  <app-listing-top-bar
    [activeTab]="activeTab()"
    [visibleCount]="visibleCount()"
    [totalCount]="count()"
    [loading]="loading()"
    [selectedLanguage]="selectedLanguage()"
    [filters]="filters()"
    [layoutCycleIcon]="getWorkspaceCycleIcon()"
    [googleLoginEnabled]="googleLoginEnabled()"
    [authenticatedUser]="authenticatedUser()"
    [authenticatedUserAvatarUrl]="authenticatedUserAvatarUrl()"
    [canEditUsers]="canEditUsers()"
    [canMaintainDatabase]="canMaintainDatabase()"
    (tabChange)="onTabChange($event)"
    (languageChange)="onLanguageChange($event)"
    (filtersChange)="onFiltersChange($event)"
    (layoutCycleRequest)="cycleWorkspaceLayout()"
    (fullscreenRequest)="onFullscreenRequested()"
    (googleLoginRequest)="onGoogleLoginRequested()"
    (logoutRequest)="onLogoutRequested()"
  ></app-listing-top-bar>

  @if (activeTab() === 'DASHBOARD') {
    <section class="listing-workspace">
      <div #workspaceContainer class="workspace-panels" [style.grid-template-columns]="getWorkspaceColumns()">
        <section class="workspace-panel left" [class.hidden]="leftPanelHidden()">
          <app-listing-properties-table
            [properties]="properties()"
            [sortCriteria]="sortCriteria()"
            [selectedLanguage]="selectedLanguage()"
            [lockedRowKey]="lockedSelectedPropertyKey()"
            [reviewEnabled]="authenticatedUser() !== null"
            [propertyLabels]="propertyLabels()"
            [page]="pagination().page"
            [pageSize]="pagination().pageSize"
            [totalPages]="pagination().totalPages"
            [loading]="loading()"
            (sortToggle)="onSortToggle($event)"
            (propertyHover)="onPropertyRowHover($event)"
            (propertySelect)="onPropertyRowClick($event)"
            (propertyReviewToggle)="onPropertyReviewToggle($event)"
            (pageChange)="onPageChange($event)"
            (pageSizeChange)="onPageSizeChange($event)"
          ></app-listing-properties-table>
        </section>

        <div class="workspace-splitter" (mousedown)="onSplitterMouseDown($event)"></div>

        <section class="workspace-panel right" [class.hidden]="rightPanelHidden()">
          <app-property-detail-panel
            [property]="selectedProperty()"
            [selectedLanguage]="selectedLanguage()"
            [staticMediaBaseUrl]="getStaticMediaBaseUrl()"
            [googleMapsApiKey]="getGoogleMapsApiKey()"
            [googleMapsMapId]="getGoogleMapsMapId()"
            [reviewEnabled]="authenticatedUser() !== null"
            [propertyLabels]="propertyLabels()"
            (propertyReviewToggle)="onPropertyReviewToggle($event)"
            (propertyCommentSave)="onPropertyCommentSave($event)"
          ></app-property-detail-panel>
        </section>
      </div>
    </section>
  }

  @if (activeTab() === 'DATABASE_MAINTENANCE_TAB' && canMaintainDatabase()) {
    <app-maintenance-panel
      [maintenanceOperations]="maintenanceOperations"
      [maintenanceRunning]="maintenanceRunning()"
      [maintenanceResultText]="maintenanceResultText()"
      [selectedLanguage]="selectedLanguage()"
      (operationRequested)="onMaintenanceOperationRequested($event)"
    ></app-maintenance-panel>
  }

  @if (activeTab() === 'USERS_TAB' && canEditUsers()) {
    <app-users-panel
      [users]="users()"
      [loading]="usersLoading()"
      [selectedLanguage]="selectedLanguage()"
      [currentUserId]="authenticatedUser()?.id ?? null"
      (deleteUserRequest)="onDeleteUserRequested($event)"
    ></app-users-panel>
  }
</main>
