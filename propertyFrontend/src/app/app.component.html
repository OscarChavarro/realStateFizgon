<main class="dashboard-page">
  <app-dashboard-top-bar
    [activeTab]="activeTab()"
    [count]="count()"
    [loading]="loading()"
    [selectedLanguage]="selectedLanguage()"
    (tabChange)="onTabChange($event)"
    (languageChange)="onLanguageChange($event)"
    (fullscreenRequest)="onFullscreenRequested()"
  ></app-dashboard-top-bar>

  @if (activeTab() === 'DASHBOARD') {
    <section class="dashboard-workspace">
      <div #workspaceContainer class="workspace-panels" [style.grid-template-columns]="getWorkspaceColumns()">
        <section class="workspace-panel left" [class.hidden]="leftPanelHidden()">
          <app-dashboard-properties-table
            [properties]="properties()"
            [sortCriteria]="sortCriteria()"
            [selectedLanguage]="selectedLanguage()"
            [lockedRowKey]="lockedSelectedPropertyKey()"
            (sortToggle)="onSortToggle($event)"
            (propertyHover)="onPropertyRowHover($event)"
            (propertySelect)="onPropertyRowClick($event)"
          ></app-dashboard-properties-table>
        </section>

        <div class="workspace-splitter" (mousedown)="onSplitterMouseDown($event)">
          <div class="splitter-controls">
            <button type="button" class="splitter-button" (click)="cycleWorkspaceLayout()">
              <span class="material-symbols-outlined">{{ getWorkspaceCycleIcon() }}</span>
            </button>
          </div>
        </div>

        <section class="workspace-panel right" [class.hidden]="rightPanelHidden()">
          <app-property-detail-panel
            [property]="selectedProperty()"
            [selectedLanguage]="selectedLanguage()"
            [staticMediaBaseUrl]="getStaticMediaBaseUrl()"
          ></app-property-detail-panel>
        </section>
      </div>
    </section>
  }

  @if (activeTab() === 'DATABASE_MAINTENANCE_TAB') {
    <app-dashboard-maintenance-panel
      [maintenanceOperations]="maintenanceOperations"
      [maintenanceRunning]="maintenanceRunning()"
      [maintenanceResultText]="maintenanceResultText()"
      [selectedLanguage]="selectedLanguage()"
      (operationRequested)="onMaintenanceOperationRequested($event)"
    ></app-dashboard-maintenance-panel>
  }
</main>
