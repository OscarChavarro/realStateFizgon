<div #mapLayout class="google-map-layout">
  @if (isLayerPanelVisible) {
    <aside class="google-map-layer-panel" [style.width.px]="layerPanelWidthPx">
      <app-google-map-layer-panel
        [layerOptions]="layerOptions"
        [mapVisualStyleOptions]="mapVisualStyleOptions"
        [selectedMapVisualStyle]="selectedMapVisualStyle"
        [selectedLanguage]="selectedLanguage"
        [isLayerEnabled]="isLayerEnabled.bind(this)"
        (layerToggle)="onLayerToggleChange($event.id, $event.checked)"
        (mapVisualStyleChange)="onMapVisualStyleChange($event)"
      ></app-google-map-layer-panel>
    </aside>
    <div
      class="google-map-layer-splitter"
      role="separator"
      aria-orientation="vertical"
      (mousedown)="onLayerPanelSplitterMouseDown($event)"
    ></div>
  }

  <div class="google-map-pane">
    @if (mapLoadError) {
      <div class="google-map-message">{{ mapLoadError }}</div>
    } @else {
      <div #mapContainer class="google-map"></div>
      @if (interactionEnabled && selectedPropertySummary !== null) {
        <div #miniSummaryContainer class="google-map-mini-summary" tabindex="-1">
          <app-google-map-selection-overlay
            [property]="selectedPropertySummary"
            [selectedLanguage]="selectedLanguage"
            (closeRequested)="onPropertyMiniSummaryCloseRequested()"
          ></app-google-map-selection-overlay>
        </div>
      }
    }
  </div>
</div>
