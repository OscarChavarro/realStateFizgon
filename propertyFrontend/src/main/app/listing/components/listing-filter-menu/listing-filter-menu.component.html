<div class="filter-menu">
  <button
    type="button"
    class="filter-trigger"
    [class.open]="menuOpen()"
    [attr.aria-expanded]="menuOpen()"
    aria-haspopup="true"
    (click)="onToggleMenu()"
  >
    <span class="material-symbols-outlined">filter_alt</span>
    <span class="filter-label">{{ t('FILTERS') }}</span>
  </button>

  @if (menuOpen()) {
    <div class="filter-dropdown" role="menu">
      <label class="filter-option">
        <input
          type="checkbox"
          [checked]="filters.showClosed"
          (change)="onShowClosedChange($any($event.target).checked)"
        />
        <span>{{ t('SHOW_CLOSED_PROPERTIES') }}</span>
      </label>

      @if (reviewFiltersEnabled) {
        <label class="filter-option">
          <input
            type="checkbox"
            [checked]="filters.showNew"
            (change)="onShowNewChange($any($event.target).checked)"
          />
          <span>{{ t('SHOW_REVIEW_NEW') }}</span>
        </label>
        <label class="filter-option">
          <input
            type="checkbox"
            [checked]="filters.showFavourite"
            (change)="onShowFavouriteChange($any($event.target).checked)"
          />
          <span>{{ t('SHOW_REVIEW_FAVOURITE') }}</span>
        </label>
        <label class="filter-option">
          <input
            type="checkbox"
            [checked]="filters.showRejected"
            (change)="onShowRejectedChange($any($event.target).checked)"
          />
          <span>{{ t('SHOW_REVIEW_REJECTED') }}</span>
        </label>
      }

      <label class="filter-date-option">
        <span class="filter-date-label">{{ t('MIN_PUBLICATION_DATE') }}</span>
        <input
          type="date"
          class="filter-date-input"
          [value]="filters.minPublicationDate"
          (change)="onMinPublicationDateChange($any($event.target).value)"
        />
      </label>

      <label class="filter-date-option">
        <span class="filter-date-label">{{ t('MAX_PUBLICATION_DATE') }}</span>
        <input
          type="date"
          class="filter-date-input"
          [value]="filters.maxPublicationDate"
          (change)="onMaxPublicationDateChange($any($event.target).value)"
        />
      </label>

      <app-listing-price-range-filter
        [selectedLanguage]="selectedLanguage"
        [minPrice]="filters.minPrice"
        [maxPrice]="filters.maxPrice"
        (minPriceChange)="onMinPriceChange($event)"
        (maxPriceChange)="onMaxPriceChange($event)"
      ></app-listing-price-range-filter>
    </div>
  }
</div>
